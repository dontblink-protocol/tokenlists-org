# 提交扫密钥：只扫这次 PR 或这次推送带来的提交，发现疑似密钥就让检查失败。
# Secret scan: scans only the commits in this PR / this push with the gitleaks CLI.
# 不用第三方 marketplace action、不需要 license、不读任何 secret。
# 升级 gitleaks：改 GITLEAKS_VERSION，并把 GITLEAKS_SHA256 换成新版本 checksums.txt 里 linux_x64 那一行的哈希。
name: secret-scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # 1) 和写死在本文件里的哈希比对
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          # 2) 再和官方 checksums 文件比对
          grep -E "  ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gitleaks version
          gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gitleaks version
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::push 之前的提交不可用（新分支或强推），只扫最新一个提交"
            range="-1 ${AFTER_SHA}"
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          gitleaks git --redact --no-banner --log-opts="${range}" .
